[project]
name = "aissemble-summarization-example"
version = "1.5.0.dev"
description = "Example demonstrating text summarization with aiSSEMBLE OIP"
readme = "README.md"
authors = [
    { name = "aiSSEMBLE Team", email = "aissemble@bah.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aissemble-oip-core",
    "aissemble-oip-sumy",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
ignore = ["E741"]

[tool.uv.sources]
aissemble-oip-core = { path = "../../aissemble-oip-core", editable = true }
aissemble-oip-sumy = { path = "../../aissemble-oip-modules/aissemble-oip-sumy", editable = true }
aissemble-oip-common-test = { path = "../../aissemble-oip-modules/aissemble-oip-common-test", editable = true }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"

[dependency-groups]
dev = [
    "ruff>=0.14.9",
    "behave>=1.2.6",
    "mlserver>=1.6.0",
    "sumy>=0.11.0",
    "nltk>=3.8",
    "kappa-maki>=1.0.2",
    "aissemble-oip-common-test",
]

test = [
    "behave>=1.2.6",
    "mlserver>=1.6.0",
    "sumy>=0.11.0",
    "nltk>=3.8",
    "aissemble-oip-common-test",
]
