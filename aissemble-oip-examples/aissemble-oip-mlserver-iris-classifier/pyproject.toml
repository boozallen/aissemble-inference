[project]
name = "aissemble-oip-mlserver-iris-classifier"
version = "1.5.0.dev"
description = "A simple example demonstrating MLServer basics"
readme = "README.md"
authors = [
    { name = "aiSSEMBLE Baseline Community", email = "aissemble@bah.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mlserver>=1.6.0",
    "scikit-learn>=1.5.0",
]

[project.scripts]
run_server = "iris_classifier_model.server:run_server"

# Added by habushu-maven-plugin at 2025-12-04T09:56:52.109618 to use https://pypi.org/simple/ as source repository for installing dependencies
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://pypi.org/simple/"

[tool.uv]
# Exclude perf-analyzer on macOS (no ARM64 wheels available)
override-dependencies = [
    "perf-analyzer ; sys_platform != 'darwin'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iris_classifier"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.14.7",
]
