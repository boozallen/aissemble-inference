[project]
name = "aissemble-oip-common-test"
version = "1.5.0.dev"
description = "Reusable MLServer test utilities for aiSSEMBLE Open Inference Protocol"
readme = "README.md"
authors = [
    { name = "aiSSEMBLE Team", email = "aissemble@bah.com" }
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
ignore = ["E741"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://pypi.org/simple/"

[dependency-groups]
dev = [
    "ruff>=0.14.9",
    "behave>=1.2.6",
    "mlserver>=1.6.0",
]

test = [
    "behave>=1.2.6",
    "mlserver>=1.6.0",
]
