[project]
name = "aissemble-inference-sumy"
version = "1.5.0.dev"
description = "sumy model family support for aiSSEMBLE Inference"
readme = "README.md"
authors = [
    { name = "aiSSEMBLE Team", email = "aissemble@bah.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aissemble-inference-core",
    "sumy>=0.11.0",
    "nltk>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["target/"]

[tool.ruff.lint]
ignore = ["E741"]

[tool.uv.sources]
aissemble-inference-core = { path = "../../aissemble-inference-core", editable = true }
aissemble-inference-common-test = { path = "../aissemble-inference-common-test", editable = true }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://pypi.org/simple/"

[project.entry-points."inference.runtimes"]
sumy = "aissemble_inference_sumy:SumyRuntime"

[project.entry-points."inference.translators"]
sumy = "aissemble_inference_sumy:SumyTranslator"

[dependency-groups]
dev = [
    "ruff>=0.14.9",
    "behave>=1.2.6",
    "kappa-maki>=1.0.2",
    "mlserver>=1.6.0",
    "sumy>=0.11.0",
    "nltk>=3.8",
    "aissemble-inference-common-test",
]

test = [
    "behave>=1.2.6",
    "mlserver>=1.6.0",
    "sumy>=0.11.0",
    "nltk>=3.8",
    "aissemble-inference-common-test",
]
