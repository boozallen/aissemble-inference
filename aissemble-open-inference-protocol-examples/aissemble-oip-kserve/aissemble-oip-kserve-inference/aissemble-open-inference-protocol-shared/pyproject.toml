[project]
name = "aissemble-open-inference-protocol-shared"
version = "1.0.0.dev"
description = "Shared Utilities for aiSSEMBLE Open Inference Protocol"
authors = [
    {name = "Annie Chang",email = "chang_anne@bah.com"}
]
readme = "README.md"
requires-python = ">=3.11.4,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers"
]
license = { text = "Booz Allen Public License v1.0" }
license-files = ["LICENSE*"]
dynamic = ["version", "dependencies"]

[project.urls]
Homepage = "https://github.com/boozallen/aissemble-open-inference-protocol"

[tool.poetry]
packages = [
    { include="aissemble_open_inference_protocol_shared", from="src" }
]


[tool.poetry.dependencies]
fastapi = {extras = ["standard"], version = "^0.115.12"}
pydantic = "^2.11.4"
krausening = ">=20"


[tool.poetry.group.dev.dependencies]
ruff = "^0.11.12"
behave = "^1.2.6"
kappa-maki = "^1.0.2"
nose = ">=1.3.7"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
