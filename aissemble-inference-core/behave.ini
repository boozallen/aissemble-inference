[behave]
paths = tests/features
show_skipped = false
show_timings = true
color = true
stdout_capture = true
stderr_capture = true
log_capture = true

[behave.formatters]
plain = behave.formatter.plain:PlainFormatter
pretty = behave.formatter.pretty:PrettyFormatter

