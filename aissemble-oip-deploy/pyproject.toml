[project]
name = "aissemble-oip-deploy"
version = "1.5.0.dev"
description = "Deployment tooling for aiSSEMBLE Open Inference Protocol - generates Docker, Kubernetes, and KServe configs"
readme = "README.md"
authors = [
    { name = "aiSSEMBLE Team", email = "aissemble@bah.com" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "tomlkit>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
ignore = ["E741"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://pypi.org/simple/"

[project.scripts]
oip = "aissemble_oip_deploy.cli:main"

[project.entry-points."oip.generators"]
local = "aissemble_oip_deploy.generators:LocalGenerator"
docker = "aissemble_oip_deploy.generators:DockerGenerator"

[dependency-groups]
dev = [
    "ruff>=0.14.9",
    "behave>=1.2.6",
]

test = [
    "behave>=1.2.6",
]
