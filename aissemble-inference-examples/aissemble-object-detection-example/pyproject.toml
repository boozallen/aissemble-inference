[project]
name = "aissemble-object-detection-example"
version = "1.5.0.dev"
description = "aiSSEMBLE Inference Object Detection Example"
readme = "README.md"
authors = [
    { name = "aiSSEMBLE Team", email = "aissemble@bah.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aissemble-inference-core",
    "aissemble-inference-yolo",
    "requests>=2.31.0",
    "pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["target/"]

[tool.ruff.lint]
ignore = ["E741"]

[tool.uv.sources]
aissemble-inference-core = { path = "../../aissemble-inference-core", editable = true }
aissemble-inference-yolo = { path = "../../aissemble-inference-modules/aissemble-inference-yolo", editable = true }
aissemble-inference-common-test = { path = "../../aissemble-inference-modules/aissemble-inference-common-test", editable = true }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://pypi.org/simple/"

[dependency-groups]
dev = [
    "ruff>=0.14.9",
    "behave>=1.2.6",
    "kappa-maki>=1.0.2",
    "mlserver>=1.6.0",
    "ultralytics>=8.0.0",
    "aissemble-inference-common-test",
]

test = [
    "behave>=1.2.6",
    "mlserver>=1.6.0",
    "ultralytics>=8.0.0",
    "aissemble-inference-common-test",
]
