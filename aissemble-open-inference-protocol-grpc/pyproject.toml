[project]
name = "aissemble-open-inference-grpc"
version = "1.0.0.dev"
description = ""
authors = [
    {name = "Clay Woods",email = "Woods_Clay@ne.bah.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio (>=1.73.0,<2.0.0)",
    "krausening (>=20,<21)",
    "grpcio-tools (>=1.73.0,<2.0.0)"
]
dynamic = ["version", "dependencies"]

[tool.poetry]
packages = [{include = "aissemble_open_inference_protocol_grpc", from = "src"}]

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.13"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
ignore = ["E4","F"]
