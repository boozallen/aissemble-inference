[project]
name = "aissemble-oip-core"
version = "1.5.0.dev"
description = "Core aiSSEMBLE Open Inference Protocol (OIP) functionality"
readme = "README.md"
authors = [
    { name = "aiSSEMBLE Team", email = "aissemble@bah.com" }
]
requires-python = ">=3.9.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
ignore = ["E741"]

# Added by habushu-maven-plugin at 2025-12-17T14:35:51.696072 to use https://pypi.org/simple/ as source repository for installing dependencies
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://pypi.org/simple/"

[dependency-groups]
dev = [
    "ruff>=0.14.9",
]
