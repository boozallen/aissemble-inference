[tool.poetry]
packages = [{include = "aissemble_oip_fastapi_inference", from = "src"}]

[project]
name = "aissemble-oip-fastapi-inference"
version = "1.1.0.dev"
description = "A FastAPI Example of the Open Inference Protocol"
authors = [
    {name = "aiSSEMBLE Solutions Community", email = "aissemble@bah.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
    "Intended Audience :: Developers"
]
license = "Apache-2.0"
license-files = ["LICENSE*"]
dynamic = ["version", "dependencies"]

[tool.poetry.dependencies]
fastapi = {extras = ["standard"], version = ">=0.116.1"}
tensorflow = ">=2.16.0,<2.17.0"
keras = ">=3.11.0"
krausening = ">=20"
aissemble-open-inference-protocol-fastapi = {path = "../../../aissemble-open-inference-protocol-fastapi", develop = true}

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.12"
behave = "^1.2.6"
kappa-maki = "^1.0.2"

[tool.poetry.scripts]
run_server = "aissemble_oip_fastapi_inference.main:main"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
