[project]
name = "aissemble-oip-core"
version = "1.5.0.dev"
description = "Core aiSSEMBLE Open Inference Protocol (OIP) functionality"
readme = "README.md"
authors = [
    { name = "aiSSEMBLE Team", email = "aissemble@bah.com" }
]
requires-python = ">=3.9.14"
dependencies = [
    "mlserver>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.entry-points."oip.translators"]
object_detection = "aissemble_oip_core.client.translators:DefaultObjectDetectionTranslator"

[project.entry-points."oip.builders"]
object_detection = "aissemble_oip_core.client.builder:ObjectDetectionBuilder"

[tool.ruff.lint]
ignore = ["E741"]

# Added by habushu-maven-plugin at 2025-12-17T14:35:51.696072 to use https://pypi.org/simple/ as source repository for installing dependencies
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://pypi.org/simple/"

[dependency-groups]
dev = [
    "ruff>=0.14.9",
    "behave>=1.2.6",
    "pillow>=10.0.0",
    "kappa-maki>=1.0.2",
]

test = [
    "behave>=1.2.6",
    "pillow>=10.0.0",
]
