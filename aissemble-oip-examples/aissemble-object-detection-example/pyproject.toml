[project]
name = "aissemble-object-detection-example"
version = "1.5.0.dev"
description = "aiSSEMBLE Open Inference Protocol (OIP) Object Detection Example"
readme = "README.md"
authors = [
    { name = "aiSSEMBLE Team", email = "aissemble@bah.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aissemble-oip-core",
    "aissemble-oip-yolo",
    "requests>=2.31.0",
    "pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["target/"]

[tool.ruff.lint]
ignore = ["E741"]

[tool.uv.sources]
aissemble-oip-core = { path = "../../aissemble-oip-core", editable = true }
aissemble-oip-yolo = { path = "../../aissemble-oip-modules/aissemble-oip-yolo", editable = true }
aissemble-oip-common-test = { path = "../../aissemble-oip-modules/aissemble-oip-common-test", editable = true }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://pypi.org/simple/"

[dependency-groups]
dev = [
    "ruff>=0.14.9",
    "behave>=1.2.6",
    "kappa-maki>=1.0.2",
    "mlserver>=1.6.0",
    "ultralytics>=8.0.0",
    "aissemble-oip-common-test",
]

test = [
    "behave>=1.2.6",
    "mlserver>=1.6.0",
    "ultralytics>=8.0.0",
    "aissemble-oip-common-test",
]
