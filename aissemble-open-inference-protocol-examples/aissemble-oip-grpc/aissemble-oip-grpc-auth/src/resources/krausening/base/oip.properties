# gRPC Server Configuration for Authorization Example
# This file demonstrates how to configure gRPC server with authorization enabled

# Server Configuration
# grpc_host=0.0.0.0
# grpc_port=8080
# grpc_workers=3

# Authorization Configuration
auth_enabled=true
# If protected_endpoints is empty, all endpoints will be protected
# protected_endpoints=/inference.GrpcInferenceService/ModelInfer

# JWT Configuration
auth_secret=your-secret-key
auth_algorithm=HS256
