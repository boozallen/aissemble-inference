[tool.poetry]
packages = [{include = "aissemble_oip_grpc_inference", from = "src"}]

[project]
name = "aissemble-oip-grpc-inference"
version = "1.1.0.dev"
description = "A gRPC Example of the Open Inference Protocol"
authors = [
    {name = "aiSSEMBLE Solutions Community", email = "aissemble@bah.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers"
]
license = "Booz Allen Public License v1.0"
license-files = ["LICENSE*"]
dynamic = ["version", "dependencies"]

[project.scripts]
run_server = "aissemble_oip_grpc_inference.server:run_server"

[tool.poetry.dependencies]
grpcio = ">=1.73.0,<2.0.0"
krausening = ">=20"
aissemble-open-inference-protocol-grpc = {path = "../../../aissemble-open-inference-protocol-grpc", develop = true}

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.12"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
ignore = ["F", "E4", "E7", "E9"]
