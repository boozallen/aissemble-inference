[project]
name = "aissemble-open-inference-protocol-grpc"
version = "1.0.0.dev"
description = "A gRPC implementation of the Open Inference Protocol"
authors = [
    {name = "aiSSEMBLE Solutions Community", email = "aissemble@bah.com"}
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers"
]
license = { text = "Booz Allen Public License v1.0" }
license-files = ["LICENSE*"]
dependencies = [
    "grpcio (>=1.73.0,<2.0.0)",
    "krausening (>=20,<21)",
    "grpcio-tools (>=1.73.0,<2.0.0)"
]
dynamic = ["version", "dependencies"]

[project.urls]
Homepage = "https://github.com/boozallen/aissemble-open-inference-protocol"

[tool.poetry]
packages = [{include = "aissemble_open_inference_protocol_grpc", from = "src"}]

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.13"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
ignore = ["E4","F"]
