# CI values for EKS deployment
# Usage: helm install iris-classifier ./iris-classifier -f ./iris-classifier/values-ci.yaml

replicaCount: 1

image:
  repository: ghcr.io/boozallen/aissemble-oip-mlserver-iris-example
  pullPolicy: Always
  tag: "0.1.0-amd64"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

