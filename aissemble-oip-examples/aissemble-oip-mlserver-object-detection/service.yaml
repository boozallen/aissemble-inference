apiVersion: v1
kind: Service
metadata:
  name: img-detection-service
spec:
  selector:
    app: img-detection
  type: LoadBalancer  # Exposes service externally in Rancher
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: grpc
    port: 8081
    targetPort: 8081
  - name: metrics
    port: 8082
    targetPort: 8082