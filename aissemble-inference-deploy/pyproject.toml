[project]
name = "aissemble-inference-deploy"
version = "1.5.0.dev"
description = "Deployment tooling for aiSSEMBLE Inference - generates Docker, Kubernetes, and KServe configs"
readme = "README.md"
authors = [
    { name = "aiSSEMBLE Team", email = "aissemble@bah.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "tomlkit>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["target/"]

[tool.ruff.lint]
ignore = ["E741"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://pypi.org/simple/"

[project.scripts]
inference = "aissemble_inference_deploy.cli:main"

[project.entry-points."inference.generators"]
local = "aissemble_inference_deploy.generators:LocalGenerator"
docker = "aissemble_inference_deploy.generators:DockerGenerator"
kubernetes = "aissemble_inference_deploy.generators:KubernetesGenerator"
kserve = "aissemble_inference_deploy.generators:KServeGenerator"

[dependency-groups]
dev = [
    "ruff>=0.14.9",
    "behave>=1.2.6",
]

test = [
    "behave>=1.2.6",
]
